[paths]
data_dir = data/preprocessed
outputs_dir = outputs
cesnet_tls22_zip = data/raw/cesnet_tls22/cesnet-tls22.zip
cipherspectrum_dir = data/raw/cipherspectrum
kmu_tls_flows = data/raw/kmu_tls/flows.npz
echpair_hosts_parquet = data/raw/echpair/hosts.parquet
echpair_probe_parquet = data/raw/echpair/probe.parquet

[flows]
width = 71
response_window = 50
mss = 1448
ppi_max = 30

[cesnet_tls22]
reservoir = 2500
cap = 2000
min_train = 2000
min_test = 2000
workers = 16

[cipherspectrum]
time_cut = 2024-02-20
browser = firefox
min_train = 50
min_test = 50

[kmu_tls]
min_train = 800
min_test = 800

[echpair]
hosts = wnsrvbjmeprtfrnfx.ay.delivery,adreq.adster.tech,usync.4dex.io
host_months = 202607,202608,202609,202610
probe_labels = meokbangpae,mtlevel,ondotoon,wolfdotcom
probe_exclude_host_group = wftoon221.com
per_class = 100

[experiment]
ns = 1,2,3,4,5,6,8,10,12,15,20,25,30,35,40,45,50,55
nmax = kmu_tls:30,cipherspectrum:55,cesnet_tls22:30,echpair:55
inputs = ch_included,ch_burst_removed,fbe,drop4,drop8
conditions = unchanged,ch_length_replaced,emulated_pqc,real_ech
pqc_datasets = cipherspectrum
threads = 4
n_jobs = 8

[emulation]
pqc_client_bytes = 1220
pqc_server_bytes = 1088

[lightgbm]
n_estimators = 120
learning_rate = 0.1
num_leaves = 31
min_child_samples = 20
reg_lambda = 1.0
max_bin = 255
kmu_tls_learning_rate = 0.05
kmu_tls_n_estimators = 240
cesnet_small_n = 4
cesnet_small_n_learning_rate = 0.03

[cnn]
device = auto
embedding_dim = 32
channels = 128
dilations = 1,1,2,2
dropout = 0.2
token_limit = 2000
log_bins = 400
log_start = 1600
log_end = 1000000
lr = 0.002
weight_decay = 0.0001
small_threshold = 20000
small_batch = 64
small_epochs = 30
large_batch = 512
large_epochs = 15
eval_batch = 8192
